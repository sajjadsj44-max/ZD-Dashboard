<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZD PDF Takeoff — Free Drawing Agent</title>
<style>
html,body,iframe{width:100%;height:100%;margin:0;border:0}body{overflow:hidden;background:#eef2f7}iframe{position:fixed;inset:0;z-index:0}#agentStatus{position:fixed;top:8px;right:8px;z-index:20;padding:7px 10px;border:1px solid #dde5ee;border-radius:6px;background:#fff;color:#334;font:12px "Segoe UI",Arial,sans-serif;box-shadow:0 2px 8px rgba(15,41,66,.16)}#agentStatus.error{color:#9b2222}
</style>
</head>
<body>
<iframe id="takeoffFrame" title="ZD PDF Takeoff" src="./index.html" allow="fullscreen" allowfullscreen></iframe>
<div id="agentStatus" role="status">Starting the free drawing agent…</div>
<script src="local-door-fallback.js?v=2026-10-05a"></script>
<script>
const takeoffFrame = document.getElementById("takeoffFrame");
Object.defineProperty(window, "zdTakeoff", {get: () => {
  const api = takeoffFrame.contentWindow.zdTakeoff;
  if (api && window.installLocalDoorFallback) window.installLocalDoorFallback(api, takeoffFrame.contentDocument);
  return api;
}});
</script>
<script type="module" src="local-agent.js?v=2026-10-05g"></script>
</body>
</html>
