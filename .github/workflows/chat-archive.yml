name: Takeoff chat archive

# PDF Takeoff's Feedback chat goes through a free relay (takeoff/chat.json) that keeps messages 12 hours.
# This copies them every half hour to takeoff-chat.jsonl on the chat-archive branch (sealed, no readable text),
# where the takeoff reads them back. It never touches main, so it does not publish the site.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy the relay's messages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin chat-archive; then
            git worktree add -q arch FETCH_HEAD
          else
            git worktree add -q --detach arch
            (cd arch && git checkout -q --orphan chat-archive-new && git rm -rfq .)
          fi
          python3 tools/chat_archive.py takeoff/chat.json arch/takeoff-chat.jsonl
          cd arch
          git add takeoff-chat.jsonl 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -qm "Takeoff chat archive"
          git push -q origin HEAD:refs/heads/chat-archive
